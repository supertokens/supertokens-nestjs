name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: publish
    permissions:
      contents: write # Push the release tag and create a GitHub release.
      id-token: write

    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          if ! dpkg --compare-versions "$npm_version" ge 11.5.1; then
            echo "::error::Trusted publishing requires npm >=11.5.1; found $npm_version."
            exit 1
          fi
          echo "Using npm $npm_version."

      - name: Install Dependencies
        run: npm ci --include=optional

      - name: Check that versioning is complete
        run: |
          npm run changeset -- status --output=.git/release-plan.json
          if ! jq -e '.changesets | length == 0' .git/release-plan.json > /dev/null; then
            echo "::error::Merge the Version Packages PR before running Release."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
