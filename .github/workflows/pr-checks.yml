name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: |
          npm ci --include=optional
          # https://github.com/npm/cli/issues/4828
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test

  compatibility:
    name: NestJS ${{ matrix.nest }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '11.2.11'
            graphql: '13.1.0'
            apollo: '4.13.0'
            node: '20.x'
          - nest: '12.5.1'
            graphql: '14.2.1'
            apollo: '5.5.2'
            node: '22.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run test:compatibility -- "$NEST_VERSION" "$NEST_GRAPHQL_VERSION" "$APOLLO_VERSION"
        env:
          NEST_VERSION: ${{ matrix.nest }}
          NEST_GRAPHQL_VERSION: ${{ matrix.graphql }}
          APOLLO_VERSION: ${{ matrix.apollo }}
